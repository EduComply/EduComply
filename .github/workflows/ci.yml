# EduComply CI. No repository secrets are used: the real Neon database is never contacted.
# Integration tests run against temporary services created for each run (PostgreSQL service
# container + this repo's Redis/Keycloak Compose services) and are discarded afterwards.
name: CI

on:
  push:
    branches: [main, feature/project-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Prisma CLI needs a syntactically valid URL for validate/generate; nothing connects to it.
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
  HUSKY: '0'

jobs:
  quality:
    name: Format, lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Prisma schema validation
        run: npm run db:validate
      - name: Typecheck (backend, frontend, tools)
        run: npm run typecheck
      - name: Backend build
        run: npm run build -w backend
      - name: Frontend build
        run: npm run build -w frontend
      - name: Backend unit tests
        run: npm run test -w backend
      - name: Frontend unit tests
        run: npm run test -w frontend
      - name: Dev-tooling tests
        run: npm run test:tools

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan the full history, not only the last commit
      - name: No environment files committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "::error::Environment files must not be committed:"; echo "$bad"; exit 1; fi
          echo "No .env files tracked."
      - name: Gitleaks (findings are redacted in the log)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  docker:
    name: Docker images and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose (dependencies and full app profile)
        run: |
          docker compose -p educomply config --quiet
          docker compose -p educomply --profile app config --quiet
      - name: Build backend and frontend images
        run: docker compose -p educomply --profile app build backend frontend

  integration:
    name: Integration (temporary PostgreSQL, Redis, Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: educomply
          POSTGRES_PASSWORD: educomply
          POSTGRES_DB: educomply_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U educomply -d educomply_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://educomply:educomply@localhost:5432/educomply_ci
      DIRECT_URL: postgresql://educomply:educomply@localhost:5432/educomply_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Create a throwaway .env (random Keycloak/OIDC secrets, never printed)
        run: |
          cp .env.example .env
          sed -i "s#^DATABASE_URL=.*#DATABASE_URL=\"$DATABASE_URL\"#; s#^DIRECT_URL=.*#DIRECT_URL=\"$DIRECT_URL\"#" .env
          npm run auth:init-env
      - name: Start Redis and Keycloak (same Compose services as local development)
        run: npm run dev:deps
      - name: Apply migrations and seed roles (temporary database)
        run: |
          npm run db:migrate:deploy
          npm run db:seed
      - name: Redis integration tests
        run: npm run test:redis
      - name: Database integration tests (user sync, roles, audit, transactions)
        run: npm run test:db
      - name: Keycloak OIDC tests (login, PKCE, Redis sessions, logout)
        run: npm run test:keycloak
      - name: Full-stack e2e (login → user sync → learner/admin API → role change → logout)
        run: npm run test:e2e
      - name: Docker stack smoke test (built images, OIDC back-channel to Keycloak)
        run: |
          npm run docker:up
          npm run dev:health || true
          curl -fsS http://localhost:3000/api/v1/health
          curl -fsS http://localhost:5173/api/v1/health
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/learner)
          test "$code" = 200
          location=$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:5173/api/v1/auth/login)
          echo "login redirects to: ${location%%\?*}"
          case "$location" in
            http://localhost:8080/realms/educomply/protocol/openid-connect/auth\?*) ;;
            *) echo "::error::login did not redirect to Keycloak"; exit 1 ;;
          esac
      - name: Container logs on failure
        if: failure()
        run: docker compose -p educomply --profile app logs --tail 80 backend frontend keycloak
      - name: Stop containers
        if: always()
        run: docker compose -p educomply --profile app down --volumes
