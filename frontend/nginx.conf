# EduComply portal in Docker: static React build + same-origin API proxy, exactly like the
# Vite dev server (http://localhost:5173 → /api → backend). Same origin keeps the HttpOnly
# session cookies and the registered OIDC callback (…:5173/api/v1/auth/oidc/callback) intact.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Resolve "backend" per request via Docker's DNS: nginx starts even if the API is not up
    # yet, and follows the container when it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:3000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # Keep the browser's Host (localhost:5173), like Vite's changeOrigin: false.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routes (/learner, /admin, …) fall back to the SPA shell.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }
}
