# Secret scanning (CI job "secrets" and locally:
#   docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --config /repo/.gitleaks.toml
# Gitleaks' default rules plus EduComply-specific ones.
[extend]
useDefault = true

[[rules]]
id = "neon-connection-string"
description = "PostgreSQL connection string with credentials for a Neon host"
regex = '''postgres(?:ql)?://[^:\s'"`/]+:[^@\s'"`]+@[A-Za-z0-9.-]+\.neon\.tech'''
keywords = ["neon.tech"]

[[rules]]
id = "postgres-connection-string"
description = "PostgreSQL connection string with an embedded password (non-local host)"
regex = '''postgres(?:ql)?://[^:\s'"`/]+:([^@\s'"`$]{6,})@([A-Za-z0-9-]+\.)+[A-Za-z]{2,}'''
secretGroup = 1
keywords = ["postgres://", "postgresql://"]

[allowlist]
description = "Documented placeholders and synthetic test fixtures"
regexTarget = "match"
regexes = [
  # .env.example / docs placeholders
  '''USER:PASSWORD@''',
  # Synthetic fixtures in tests (fictional hosts)
  '''//u:p@''',
  '''@[A-Za-z0-9.-]*\.invalid''',
  '''@ep-example''',
]
